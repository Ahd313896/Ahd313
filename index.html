<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> مجلس حسيني </title>
    <style>
        /* Google Fonts for beautiful Arabic typography */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfbf6; /* Light cream background */
            background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Tajawal', sans-serif;
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 15px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0 25px 0;
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            width: 80px;
            background-color: #d1bfae;
            margin: 0 10px;
        }

        .divider svg {
            width: 16px;
            height: 16px;
            fill: #c3a87c;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #dcd1c4;
            border-radius: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #2b2b2b;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .link-card:hover, .link-card:active {
            background-color: #f9f8f4;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-color: #c3a87c;
        }

        .icon-wrapper {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #dcd1c4;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: #1a1a1a;
        }

        .link-title {
            flex-grow: 1;
            text-align: center;
            padding: 0 15px;
        }

        .arrow-icon svg {
            width: 14px;
            height: 14px;
            fill: #c3a87c;
        }

    </style>
</head>
